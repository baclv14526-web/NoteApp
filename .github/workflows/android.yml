name: Android CI – Build & Sign NoteApp APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Cài Android SDK / command-line tools ──────────────────────────────
      # actions/setup-java không tự cài Android SDK, nên cần bước riêng để có
      # $ANDROID_HOME và apksigner dùng ở bước Verify APK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Cài Gradle 8.7 (KHÔNG dùng gradlew có sẵn trong repo) ─────────────
      # Đây là điểm mấu chốt để tránh lỗi "Minimum supported Gradle version":
      # thay vì tin vào gradle-wrapper.properties có thể bị lệch version do
      # Android Studio tạo sẵn, ta cài thẳng Gradle 8.7 trên runner và gọi
      # lệnh `gradle` trực tiếp trong toàn bộ workflow này.
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ── 5. Tạo CI keystore (tự động, không cần secrets) ──────────────────────
      # APK được ký bằng key này → cài được trực tiếp trên Android.
      # Đây là development key, không dùng cho production/Play Store.
      - name: Generate CI Keystore
        run: |
          keytool -genkeypair \
            -keystore "${{ github.workspace }}/ci-keystore.jks" \
            -alias noteapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -storepass noteapp123 \
            -keypass noteapp123 \
            -dname "CN=NoteApp CI, OU=Dev, O=NoteApp, L=Hanoi, C=VN" \
            -noprompt
          echo "✅ Keystore created"
          ls -lh "${{ github.workspace }}/ci-keystore.jks"

      # ── 6. Build Debug APK ────────────────────────────────────────────────────
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      # ── 7. Build Release APK (Gradle tự ký với CI keystore) ──────────────────
      - name: Build Release APK (auto-signed)
        run: gradle assembleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PASS: noteapp123
          KEY_ALIAS: noteapp
          KEY_PASS: noteapp123

      # ── 8. Verify APK có thể cài được ─────────────────────────────────────────
      - name: Verify APKs
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"

          echo ""
          echo "=== Debug APK ==="
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --print-certs "$DEBUG_APK" && echo "✅ Debug APK signed OK"

          echo ""
          echo "=== Release APK ==="
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$RELEASE_APK" ]; then
            ls -lh "$RELEASE_APK"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
              --print-certs "$RELEASE_APK" && echo "✅ Release APK signed OK"
          else
            echo "⚠️  Release APK not found at expected path"
            find app/build/outputs/apk -name "*.apk"
          fi

      # ── 9. Upload Debug APK ───────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: "NoteApp-debug-${{ github.run_number }}"
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 10. Upload Release APK (signed) ───────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: "NoteApp-release-${{ github.run_number }}"
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 11. Summary ───────────────────────────────────────────────────────────
      - name: Build Summary
        if: always()
        run: |
          echo "## 📦 Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cách cài APK lên Android:" >> $GITHUB_STEP_SUMMARY
          echo "1. Vào tab **Actions** → click vào run này" >> $GITHUB_STEP_SUMMARY
          echo "2. Kéo xuống phần **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "3. Tải **NoteApp-release-${{ github.run_number }}** về máy tính" >> $GITHUB_STEP_SUMMARY
          echo "4. Giải nén ZIP → lấy file **app-release.apk**" >> $GITHUB_STEP_SUMMARY
          echo "5. Copy APK vào điện thoại" >> $GITHUB_STEP_SUMMARY
          echo "6. Trên Android: **Cài đặt → Ứng dụng → Nguồn không xác định → Bật**" >> $GITHUB_STEP_SUMMARY
          echo "7. Mở file manager → tap vào APK → Cài đặt" >> $GITHUB_STEP_SUMMARY

  # ── Production release với keystore thật (chỉ khi push tag vX.Y.Z) ──────────
  release-prod:
    name: Production Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.HAS_KEYSTORE == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Giải mã production keystore từ secret (tạo bằng: base64 -i keystore.jks)
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d \
            > "${{ github.workspace }}/ci-keystore.jks"

      - name: Build Production APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
